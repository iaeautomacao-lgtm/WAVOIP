version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wavoip-redis
    restart: always
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: wavoip-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-tFNBllcdsazEvjTCeWuKpeeiCgfjBfhs}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-railway}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.mysql.sql:/docker-entrypoint-initdb.d/schema.mysql.sql:ro
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: wavoip-web
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tFNBllcdsazEvjTCeWuKpeeiCgfjBfhs}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-railway}
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mysql

  worker:
    build: .
    container_name: wavoip-worker
    restart: always
    command: celery -A tasks.celery worker --loglevel=info --concurrency=10 -Q celery,imports
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tFNBllcdsazEvjTCeWuKpeeiCgfjBfhs}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-railway}
    depends_on:
      - redis
      - mysql

  beat:
    build: .
    container_name: wavoip-beat
    restart: always
    command: celery -A tasks.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tFNBllcdsazEvjTCeWuKpeeiCgfjBfhs}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-railway}
    depends_on:
      - redis
      - mysql

volumes:
  mysql_data:
